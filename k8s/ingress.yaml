apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fullstack-ingress
spec:
  rules:
    - host: myapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service   # اسم السيرفس حق الفرونت
                port:
                  number: 80
          - path: /customers
            pathType: Prefix
            backend:
              service:
                name: backend-service   # اسم السيرفس حق الباك
                port:
                  number: 8080
